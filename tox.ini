# Use tox (https://tox.readthedocs.io/) for running tests in different environments
# To run tests in all environments: `tox`
# To run tests in a specific environment: `tox -e py314-pandas2`
# To run tests in a specific environment with pytest arguments (e.g. -v for
# verbose): `tox -e py314-pandas2 -- -v`
# ini config is deprecated: should have done in pyproject.toml but syntax
# is easier here

[tox]
# Generates a matrix matching your python versions with pandas versions
envlist = py314-pandas{2,3}

[testenv]
description = run unit tests
deps =
    pytest
    pytest-cov
    pandas2: pandas>=2.0,<3.0
    pandas3: pandas>=3.0.0rc0,<4.0
commands =
    pytest {posargs:tests}
