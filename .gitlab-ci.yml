build:
  stage: build
  only:
    - main
    - tags
  before_script:
    - source $VENV_PATH/bin/activate
    - pip install build  # cibuildwheel
  script:
    - python3 -m build -s
    - python3 -m build -w
    # - python3 -m cibuildwheel --output-dir ./dist
  artifacts:
    paths:
      - dist/
    expire_in: 24 hours


test:
  stage: test
  image: python:${PYTHON_VERSION}
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12", "3.13", "3.14"]
  only:
   - main
   - tags
   - merge_requests
  before_script:
    - source $VENV_PATH/bin/activate
    - pip install .[dev]
  script:
    - pytest


deploy_test:
  stage: deploy
  only:
    - main
    - tags
  environment:
    name: testpypi
    url: https://test.pypi.org/p/martpy/
  id_tokens:
    TESTPYPI_ID_TOKEN:
      aud: testpypi
  before_script:
   - pip install twine
  script:
    - twine upload --repository testpypi --verbose dist/*.{whl,tar.gz}
  dependencies:
    - build
    - test


deploy_to_pypi:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG =~ $PEP_440_REGEX
      when: on_success
    - when: never
  environment: pypi
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  before_script:
    - pip install twine
  script:
    - twine upload --verbose dist/*
  dependencies:
    - build
    - test
    - deploy_test
