image: python:latest

variables:
  PIP_ROOT_USER_ACTION: ignore
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # see https://peps.python.org/pep-0440/
  PEP_440_REGEX: /^(?P<epoch>\D+)?(?P<version>(?P<release>\d+(?:\.\d+)*)(?P<pre>(?:a|b|rc)\d+?)?((?P<post>\.post\d+))?(?P<dev>\.dev\d+)?(?P<build>\+\S+)?)$/
  VENV_PATH: "$CI_PROJECT_DIR/venv"

stages:
  # - lint
  - build
  - test
  - deploy


.install-env: &install-env
  - cat /etc/os-release
  - python3 --version
  - python3 -m venv $VENV_PATH
  - source $VENV_PATH/bin/activate
  - pip install --upgrade pip setuptools wheel


setup:
  stage: .pre
  before_script:
    - echo 'setup env'
  script:
   - *install-env


before_script:
  - source $VENV_PATH/bin/activate


# share bewteen jobs
cache:
  paths:
    - .cache/pip
    - venv/

