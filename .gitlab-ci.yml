image: python:latest

variables:
  PIP_ROOT_USER_ACTION: ignore
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

stages:
  # - lint
  - build
  - test
  - deploy

.version_tag:
  # see https://peps.python.org/pep-0440/
  # courtesy of T. Janvier (brgm)
  only:
    variables:
      - $CI_COMMIT_TAG =~ /^(?P<epoch>\D+)?(?P<version>(?P<release>\d+(?:\.\d+)*)(?P<pre>(?:a|b|rc)\d+?)?((?P<post>\.post\d+))?(?P<dev>\.dev\d+)?(?P<build>\+\S+)?)$/
  except:
    - branches


.install-env: &install-env
  - cat /etc/os-release
  - python3 --version
  - python3 -m venv venv
  - source venv/bin/activate
  - pip install --upgrade pip setuptools wheel build


before_script:
  - *install-env


cache:
  paths:
    - .cache/pip
    - venv/

