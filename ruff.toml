# from ruff doc: https://docs.astral.sh/ruff/configuration/

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.12
target-version = "py312"

extend-exclude = [
    ".git",
    "__pycache__",
    "docs/source/conf.py",
]

[lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
# blank lines E303
select = ["E4", "E7", "E9", "F", "E303", "E501"]

# extend-select = B950  : 'B'                                                                                                   
# https://github.com/PyCQA/flake8-bugbear#opinionated-warnings#    

# 2. Avoid enforcing line-length violations (`E501`),
# multiple import in one line (E401)
ignore = ["E401"]
# E501,E221,W293,W503,E701,E704,E203,E401,E231
# E501: line > 79 char                                                          
# E221: multiplespaces before operator; ok, this may be not pythonnic but so much convenient with vim
# W293: blank line contains whitespace                                          
# W503: line break before binary operator: no, this PEP8                        
# E701,704,203: https://black.readthedocs.io/en/stable/guides/using_black_with_other_tools.html#labels-why-pycodestyle-warnings 
# E401: multiple import on one line                                             
# E231: missing whitespace after , => in slice, not so good  

# Allow fix for all enabled rules (when `--fix`) is provided.
# fixable = ["ALL"]
# 3. Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

preview = true

# 4. Ignore `E402` (import violations) in all `__init__.py` files, and in selected subdirectories.
[lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]

[lint.flake8-quotes]
docstring-quotes = "double"


[format]
line-ending = "lf"

# Like Black, use double quotes for strings.
# quote-style = "double"  # "single"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
# https://black.readthedocs.io/en/stable/the_black_code_style/current_style.html#trailing-commas
skip-magic-trailing-comma = false

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"


