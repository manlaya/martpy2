[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "martpy"
authors = [
    {name = "Adrien Manlay", email = "a.manlay@brgm.fr"},
    {name = "Jean-Pierre Vergnes", email = "jp.vergnes@brgm.fr"},
    {name = "Thibault Hallouin", email = "t.hallouin@brgm.fr"},
]

description = "python package for Marthe Hydrogeological model pre/post processing"
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "COPYING"}

dynamic = [
    "version",
    "dependencies"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Hydrology",
]

keywords = ["hydrology", "groundwater", "modelling", "marthe"]

requires-python = ">=3.10"

[tool.setuptools.dynamic]
version = {attr = "martpy.__version__"}
dependencies = {file = ["requirements.txt"]}

#[project.urls]
#Homepage = 
#Repository = ""
#Documentation = 
#Changelog = 

[tool.setuptools]
include-package-data = true

# [tool.setuptools.packages.find]
