[build-system]
requires = ["setuptools", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "martpy"
authors = [
    {name = "Adrien Manlay", email = "a.manlay@brgm.fr"},
    {name = "Jean-Pierre Vergnes", email = "jp.vergnes@brgm.fr"},
    {name = "Thibault Hallouin", email = "t.hallouin@brgm.fr"},
    {name = "Simon Magne", email = "s.magne@brgm.fr"},
]

description = "python package for Marthe Hydrogeological model pre/post processing"
readme = {file = "README.md", content-type = "text/markdown"}
license = "GPL-3.0-or-later"  # SPDX short identifier
license-files = ["COPYING"]

dynamic = [
    "version",
    "dependencies"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Intended Audience :: Science/Research",
]

keywords = ["hydrology", "groundwater", "modelling", "marthe"]

requires-python = ">=3.11, < 3.15"

[project.urls]
Homepage = "https://gitlab.com/brgm/hydrogeological-modelling/marthe-tools/martpy"
Repository = "https://gitlab.com/brgm/hydrogeological-modelling/marthe-tools/martpy"
Changelog = "https://gitlab.com/brgm/hydrogeological-modelling/marthe-tools/martpy/-/blob/dev/changelog.md?ref_type=heads"
# Documentation = ""

[project.scripts]
parsedeb = "martpy.scripts.parsedeb:main"

[tool.setuptools_scm]
version_file = "src/martpy/_version.py"
# version_scheme = "calver-by-date"
local_scheme = "node-and-date"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
opt = ['matplotlib', 'geopandas', 'shapely', 'pyproj']

[dependency-groups]
doc  = ['sphinx', 'pydata-sphinx-theme']
lint = ['ruff', 'pre-commit', 'yapf']
test = ['pytest', 'pytest-cov', 'tox']
dev = [
    {include-group = "doc"},
    {include-group = "lint"},
    {include-group = "test"},
    "martpy[opt]"
]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
addopts = "-v --cov=martpy"  # -s
testpaths = [
    "tests",
]
filterwarnings = [
    # normal gridmarthe warning here:
    'ignore:No variable name found',
]

# Use tox (https://tox.readthedocs.io/) for running tests in different environments
# To run tests in all environments: `tox`
# To run tests in a specific environment: `tox -e pandas2`
# To run tests in a specific environment with pytest arguments (e.g. -v for
# verbose): `tox -e pandas2 -- -v`
[tool.tox]
requires = ["tox>=4"]
env_list = ["pandas2", "pandas3"]

[tool.tox.env_run_base]
description = "run unit tests"
deps = [
    "pytest",
    "pytest-cov",
    { replace = "if", condition = "factor.pandas2", then = ["pandas>=2.0,<3"], extend = true },
    { replace = "if", condition = "factor.pandas3", then = ["pandas>=3.0,<4"], extend = true },
]
# change of security with tox >= 4: explicitely allow external commands
allowlist_externals = ["python3", "pytest"]
commands = [
    ["python3", "-c", "import pandas; print(pandas.__version__)"],
    ["pytest", "tests"],
]

[tool.tox.env.pandas3]
# hack: force pandas 3 even if a dep installed pandas 2
# this is needed as long as gridmarthe force pandas < 3.0
# as tox order is: deps (pandas3), package_deps (gm, so pandas2), package --no-deps
# this allow to add pandas 3 install before running pytest but after all prev steps
commands_pre = [["python3", "-m", "pip", "install" , "pandas>=3"]]


[tool.numpydoc_validation]
checks = [
    "all",   # report on all checks, except the below
    "EX01",
    "SA01",
    "ES01",
]
# remember to use single quotes for regex in TOML
exclude = [  # don't report on objects that match any of these regex
    '\.undocumented_method$',
    '\.__repr__$',
    '^_.*',  # private members
]
exclude_files = [ # don't process filepaths that match these regex
    '^tests/.*',
    '^module/gui.*',
]
