[build-system]
requires = ["setuptools", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "martpy"
authors = [
    {name = "Adrien Manlay", email = "a.manlay@brgm.fr"},
    {name = "Jean-Pierre Vergnes", email = "jp.vergnes@brgm.fr"},
    {name = "Thibault Hallouin", email = "t.hallouin@brgm.fr"},
]

description = "python package for Marthe Hydrogeological model pre/post processing"
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "COPYING"}

dynamic = [
    "version",
    "dependencies"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Intended Audience :: Science/Research",
]

keywords = ["hydrology", "groundwater", "modelling", "marthe"]

requires-python = ">=3.10"

[project.urls]
Homepage = "https://gitlab.com/brgm/hydrogeological-modelling/marthe-tools/martpy"
Repository = "https://gitlab.com/brgm/hydrogeological-modelling/marthe-tools/martpy"
Changelog = "https://gitlab.com/brgm/hydrogeological-modelling/marthe-tools/martpy/-/blob/dev/changelog.md?ref_type=heads"
# Documentation = ""

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools_scm]
version_file = "src/martpy/_version.py"
# version_scheme = "calver-by-date"
local_scheme = "node-and-date"

[project.optional-dependencies]
dev = ['ruff', 'pytest', 'pre-commit']

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
addopts = "-s -v"
testpaths = [
    "tests",
]
